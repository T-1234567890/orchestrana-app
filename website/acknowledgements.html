<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Acknowledgements &amp; Licenses · Orchestrana&trade;" data-zh="致谢与许可证 · Orchestrana&trade;">Acknowledgements &amp; Licenses · Orchestrana&trade;</title>
  <meta name="description" content="Third-party acknowledgements and license text for Orchestrana." />
  <link rel="icon" type="image/png" href="screenshots/Orchestrana%20icon%201.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&amp;family=Marcellus&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="legal-document">
  <header class="site-header legal-header">
    <a class="brand" href="index.html#overview">
      <img class="brand-icon" src="screenshots/Orchestrana%20icon%201.png" alt="Orchestrana icon" />
      <span data-en="Orchestrana&trade;" data-zh="Orchestrana&trade;">Orchestrana&trade;</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html#product" data-en="Product" data-zh="产品">Product</a>
      <a href="index.html#rhythm" data-en="Rhythm" data-zh="节奏">Rhythm</a>
      <a href="index.html#ai" data-en="AI" data-zh="AI">AI</a>
      <a href="index.html#pricing" data-en="Pricing" data-zh="价格">Pricing</a>
      <a href="policies.html" data-en="Legal" data-zh="法律">Legal</a>
    </nav>
    <div class="header-actions">
      <button id="lang-toggle" class="language-toggle" aria-label="Switch language" data-en="EN / 中文" data-zh="中文 / EN">EN / 中文</button>
      <a class="header-cta" href="https://apps.apple.com/app/orchestrana/id6758972580" target="_blank" rel="noreferrer" data-en="App Store" data-zh="App Store">App Store</a>
    </div>
  </header>

  <main>
    <section class="ack-shell">
      <div class="ack-header reveal">
        <p class="section-label" data-en="Legal" data-zh="法律">Legal</p>
        <h1 data-en="Acknowledgements &amp; Licenses" data-zh="致谢与许可证">Acknowledgements &amp; Licenses</h1>
        <p class="muted" data-en="Third-party resources and local client license details." data-zh="第三方资源与本地客户端许可详情。">Third-party resources and local client license details.</p>
        <div class="legal-nav">
          <a class="soft-btn primary-ish" href="policies.html" data-en="View All Policies" data-zh="查看全部政策">View All Policies</a>
        </div>
      </div>

      <article class="ack-card fade-on-load" aria-label="Acknowledgements and licenses content">
        <div id="ack-content" class="legal-markdown">
          <p class="muted" data-en="Loading acknowledgements..." data-zh="正在加载致谢与许可证...">Loading acknowledgements...</p>
        </div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="script.js"></script>
  <script>
    (async () => {
      const contentEl = document.getElementById('ack-content');
      if (!contentEl) return;

      try {
        const res = await fetch('legal/acknowledgements/acknowledgements.md', { cache: 'no-store' });
        if (!res.ok) throw new Error('Request failed');
        const markdownText = await res.text();
        marked.setOptions({
          gfm: true,
          breaks: false,
          headerIds: true,
          mangle: false
        });
        contentEl.innerHTML = marked.parse(markdownText);
      } catch (err) {
        contentEl.innerHTML = '<p class="muted">Unable to load acknowledgements.</p>';
        return;
      }

      const firstHeading = contentEl.querySelector('h1');
      if (firstHeading) firstHeading.remove();

      contentEl.querySelectorAll('a[href]').forEach((a) => {
        const href = a.getAttribute('href') || '';
        if (/^https?:\/\//i.test(href)) {
          a.target = '_blank';
          a.rel = 'noreferrer';
        }
      });
    })();
  </script>
</body>
</html>
