<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Privacy Policy · Orchestrana&trade;" data-zh="隐私政策 · Orchestrana&trade;">Privacy Policy · Orchestrana&trade;</title>
  <meta name="description" content="Orchestrana privacy policy." />
  <link rel="icon" type="image/png" href="screenshots/Orchestrana%20icon%201.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&amp;family=Marcellus&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="legal-document">
  <header class="site-header legal-header">
    <a class="brand" href="index.html#overview">
      <img class="brand-icon" src="screenshots/Orchestrana%20icon%201.png" alt="Orchestrana icon" />
      <span data-en="Orchestrana&trade;" data-zh="Orchestrana&trade;">Orchestrana&trade;</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html#product" data-en="Product" data-zh="产品">Product</a>
      <a href="index.html#rhythm" data-en="Rhythm" data-zh="节奏">Rhythm</a>
      <a href="index.html#ai" data-en="AI" data-zh="AI">AI</a>
      <a href="index.html#pricing" data-en="Pricing" data-zh="价格">Pricing</a>
      <a href="policies.html" data-en="Legal" data-zh="法律">Legal</a>
    </nav>
    <div class="header-actions">
      <button id="lang-toggle" class="language-toggle" aria-label="Switch language" data-en="EN / 中文" data-zh="中文 / EN">EN / 中文</button>
      <a class="header-cta" href="https://apps.apple.com/app/orchestrana/id6758972580" target="_blank" rel="noreferrer" data-en="App Store" data-zh="App Store">App Store</a>
    </div>
  </header>

  <main>
    <section class="privacy-shell">
      <div class="privacy-header reveal">
        <p class="section-label" data-en="Legal" data-zh="法律">Legal</p>
        <h1 data-en="Privacy Policy" data-zh="隐私政策">Privacy Policy</h1>
        <p class="muted" data-en="This page displays the official privacy policy text (English)." data-zh="本页面展示官方隐私政策原文（英文）。">This page displays the official privacy policy text (English).</p>
        <div class="legal-nav">
          <a class="soft-btn primary-ish" href="policies.html" data-en="View All Policies" data-zh="查看全部政策">View All Policies</a>
        </div>
      </div>

      <article class="privacy-card fade-on-load" aria-label="Privacy policy content">
        <div id="privacy-content" class="privacy-markdown">
          <p class="muted" id="privacy-loading" data-en="Loading privacy policy..." data-zh="正在加载隐私政策...">Loading privacy policy...</p>
        </div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="script.js"></script>
  <script>
    (async () => {
      const contentEl = document.getElementById('privacy-content');
      if (!contentEl) return;

      const candidates = [
        'legal/privacy-policy/privacy-policy.md',
        'Screenshot/privacy_version_feb_27_2026.md',
        'screenshots/privacy_version_feb_27_2026.md'
      ];

      let markdownText = null;
      for (const url of candidates) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) continue;
          markdownText = await res.text();
          break;
        } catch (err) {}
      }

      if (!markdownText) {
        contentEl.innerHTML = '<p class="muted">Unable to load privacy policy.</p>';
        return;
      }

      try {
        marked.setOptions({
          gfm: true,
          breaks: false,
          headerIds: true,
          mangle: false
        });
        contentEl.innerHTML = marked.parse(markdownText);
      } catch (err) {
        contentEl.textContent = markdownText;
        return;
      }

      const firstHeading = contentEl.querySelector('h1');
      if (firstHeading) firstHeading.remove();

      contentEl.querySelectorAll('a[href]').forEach((a) => {
        const href = a.getAttribute('href') || '';
        if (/^https?:\/\//i.test(href)) {
          a.target = '_blank';
          a.rel = 'noreferrer';
        }
      });
    })();
  </script>
</body>
</html>
